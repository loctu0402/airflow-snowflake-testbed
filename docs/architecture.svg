<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 624" width="1000" height="624" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Airflow Snowflake testbed architecture</title>
  <desc id="desc">Cloudflare Access and a tunnel publish the main Airflow UI and one hostname per branch. GitHub Actions lints and tests every pull request and deploys main to the VM. On the VM, the main Docker Compose stack loads DW_PROD, and one stack per branch writes only to its own clone of DW_TEST, which Snowflake rebuilds from DW_PROD every night.</desc>
  <defs>
    <marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="624" rx="16" fill="#ffffff"/>

  <g>
    <rect x="24" y="24" width="220" height="180" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="40" y="52" font-size="15" font-weight="700" fill="#111827">Cloudflare</text>
    <text x="40" y="74" font-size="11" fill="#6b7280">Access allows your email domain</text>
    <rect x="40" y="88" width="188" height="26" rx="13" fill="#ffffff" stroke="#fdba74"/>
    <text x="134" y="105" font-size="11" fill="#111827" text-anchor="middle">airflow.example.dev</text>
    <rect x="40" y="122" width="188" height="26" rx="13" fill="#ffffff" stroke="#fdba74"/>
    <text x="134" y="139" font-size="11" fill="#111827" text-anchor="middle">airflow-&lt;branch&gt;.example.dev</text>
    <text x="40" y="176" font-size="11" fill="#6b7280">Tunnel to the VM, no inbound port</text>
  </g>

  <g>
    <rect x="24" y="232" width="220" height="344" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="40" y="260" font-size="15" font-weight="700" fill="#111827">GitHub Actions</text>
    <text x="40" y="288" font-size="12" font-weight="600" fill="#111827">Pull request: ci</text>
    <text x="40" y="308" font-size="11" fill="#374151">ruff, sqlfluff, shellcheck</text>
    <text x="40" y="326" font-size="11" fill="#374151">pytest and every dry run</text>
    <text x="40" y="344" font-size="11" fill="#374151">DAG import on Airflow 3.3.2</text>
    <text x="40" y="362" font-size="11" fill="#374151">compose render, main and branch</text>
    <text x="40" y="400" font-size="12" font-weight="600" fill="#111827">Merge to main: deploy</text>
    <text x="40" y="420" font-size="11" fill="#374151">simulate on a hosted runner</text>
    <text x="40" y="438" font-size="11" fill="#374151">then the self-hosted runner</text>
    <text x="40" y="456" font-size="11" fill="#374151">runs testbed deploy on the VM</text>
    <text x="40" y="474" font-size="11" fill="#374151">only when the repo variable is set</text>
    <text x="40" y="520" font-size="11" fill="#6b7280">The VM never takes an edit.</text>
    <text x="40" y="538" font-size="11" fill="#6b7280">It only fast-forwards to main.</text>
  </g>

  <g>
    <rect x="284" y="24" width="416" height="552" rx="12" fill="#ffffff" stroke="#9ca3af"/>
    <text x="300" y="50" font-size="15" font-weight="700" fill="#111827">Linux VM, Docker Compose</text>
    <rect x="300" y="62" width="150" height="26" rx="13" fill="#fff7ed" stroke="#fdba74"/>
    <text x="375" y="79" font-size="11" fill="#111827" text-anchor="middle">cloudflared</text>
    <text x="462" y="79" font-size="11" fill="#6b7280">routes :8080 and each branch port</text>

    <rect x="300" y="100" width="384" height="164" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="316" y="124" font-size="13" font-weight="700" fill="#1e3a8a">Main stack</text>
    <text x="316" y="141" font-size="11" fill="#1e40af">project testbed, follows main, writes DW_PROD</text>
    <g font-size="11" fill="#111827" text-anchor="middle">
      <rect x="316" y="154" width="84" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="358" y="172">api-server</text>
      <rect x="406" y="154" width="84" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="448" y="172">scheduler</text>
      <rect x="496" y="154" width="84" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="538" y="172">dag-processor</text>
      <rect x="586" y="154" width="84" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="628" y="172">worker</text>
      <rect x="316" y="190" width="84" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="358" y="208">triggerer</text>
      <rect x="406" y="190" width="84" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="448" y="208">postgres</text>
      <rect x="496" y="190" width="84" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="538" y="208">redis</text>
    </g>
    <text x="316" y="246" font-size="11" fill="#1e40af">CeleryExecutor, UI on 127.0.0.1:8080</text>

    <rect x="312" y="296" width="384" height="176" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="306" y="290" width="384" height="176" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="300" y="284" width="384" height="176" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="316" y="308" font-size="13" font-weight="700" fill="#134e4a">Branch stack, one per branch</text>
    <text x="316" y="325" font-size="11" fill="#115e59">own worktree, compose project, port and clone</text>
    <g font-size="11" fill="#111827" text-anchor="middle">
      <rect x="316" y="338" width="84" height="28" rx="6" fill="#ffffff" stroke="#5eead4" stroke-dasharray="4 3"/><text x="358" y="356">api-server</text>
      <rect x="406" y="338" width="84" height="28" rx="6" fill="#ffffff" stroke="#5eead4"/><text x="448" y="356">scheduler</text>
      <rect x="496" y="338" width="84" height="28" rx="6" fill="#ffffff" stroke="#5eead4"/><text x="538" y="356">dag-processor</text>
      <rect x="586" y="338" width="84" height="28" rx="6" fill="#ffffff" stroke="#5eead4"/><text x="628" y="356">postgres</text>
    </g>
    <text x="316" y="392" font-size="11" fill="#115e59">LocalExecutor, tester key only, DAGs start paused</text>
    <text x="316" y="410" font-size="11" fill="#115e59">tasks test and dags test run without the UI</text>
    <text x="316" y="428" font-size="11" fill="#115e59">the dashed api-server starts on branch ui</text>

    <rect x="300" y="492" width="384" height="68" rx="10" fill="#111827"/>
    <text x="316" y="516" font-size="13" font-weight="700" fill="#ffffff">testbed CLI</text>
    <text x="316" y="536" font-size="11" fill="#d1d5db">setup, branch up, ui, down, test task, test dag,</text>
    <text x="316" y="552" font-size="11" fill="#d1d5db">check tables, deploy. Prints every command it runs.</text>
  </g>

  <g>
    <rect x="740" y="24" width="236" height="552" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="756" y="52" font-size="15" font-weight="700" fill="#111827">Snowflake</text>

    <rect x="756" y="80" width="204" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="772" y="106" font-size="13" font-weight="700" fill="#1e3a8a">DW_PROD</text>
    <text x="772" y="125" font-size="11" fill="#1e40af">production, LOADER writes</text>

    <rect x="756" y="220" width="204" height="64" rx="10" fill="#ffffff" stroke="#5eead4"/>
    <text x="772" y="246" font-size="13" font-weight="700" fill="#134e4a">DW_TEST</text>
    <text x="772" y="265" font-size="11" fill="#115e59">last night, read-only</text>

    <rect x="756" y="364" width="204" height="64" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="772" y="390" font-size="13" font-weight="700" fill="#134e4a">DW_BR_&lt;BRANCH&gt;</text>
    <text x="772" y="409" font-size="11" fill="#115e59">TESTER writes, dropped on down</text>

    <text x="866" y="176" font-size="10.5" fill="#0f766e">zero-copy clone</text>
    <text x="866" y="191" font-size="10.5" fill="#0f766e">nightly task</text>
    <text x="866" y="318" font-size="10.5" fill="#0f766e">zero-copy clone</text>
    <text x="866" y="333" font-size="10.5" fill="#0f766e">per branch</text>

    <text x="756" y="470" font-size="11" fill="#374151">Roles LOADER, TRANSFORMER,</text>
    <text x="756" y="488" font-size="11" fill="#374151">REPORTER and TESTER</text>
    <text x="756" y="512" font-size="11" fill="#374151">TESTER has no grant on DW_PROD</text>
    <text x="756" y="536" font-size="11" fill="#374151">TEST_WH under a resource monitor</text>
  </g>

  <g fill="none" stroke-width="2" stroke-dasharray="6 6">
    <path d="M244,118 C270,118 274,75 296,75" stroke="#ea580c" marker-end="url(#head-orange)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M244,440 C268,440 272,232 296,232" stroke="#2563eb" marker-end="url(#head-blue)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M684,182 C716,182 722,112 752,112" stroke="#2563eb" marker-end="url(#head-blue)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M684,370 C716,370 722,396 752,396" stroke="#0f766e" marker-end="url(#head-teal)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M858,144 L858,214" stroke="#0f766e" marker-end="url(#head-teal)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M858,284 L858,358" stroke="#0f766e" marker-end="url(#head-teal)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-size="11" fill="#374151">
    <line x1="284" y1="602" x2="312" y2="602" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="320" y="606">production path</text>
    <line x1="440" y1="602" x2="468" y2="602" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="476" y="606">test path</text>
    <line x1="566" y1="602" x2="594" y2="602" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="602" y="606">published UI</text>
  </g>
</svg>
